# Copy to .ivy/config.toml (dev) or ~/.ivy/config.toml.
# Only this file is used; ANTHROPIC_* environment variables are ignored.
# Unknown keys are an error, so typos don't go unnoticed.

[agent]
model = "anthropic/claude-opus-5-5"  # required: "<provider>/<model id>", split at the first "/"
max_steps = 25                    # model calls per turn

[providers.anthropic]
type = "anthropic"                # API kind; only "anthropic" for now
api_key = ""                      # required
base_url = "https://api.anthropic.com"
# models = ["claude-opus-5-5", "claude-sonnet-5-5"]  # optional: limit what /model offers;
                                  # left out, /model offers everything the endpoint lists
# refusal_fallback = false        # optional, default true: if the model declines, retry on a fallback model

# A second provider, e.g. a proxy. Its models are named the same way:
# model = "proxy/vendor/model-a" is model "vendor/model-a" on this provider.
# [providers.proxy]
# api_key = "..."
# base_url = "https://my-proxy.example.com"
# models = ["vendor/model-a"]   # optional, as above

[generation]
effort = "medium"                 # low | medium | high | xhigh | max
max_tokens = 64000

# Who may run which tool without asking. Tool-name globs; checked in this order:
# deny (blocked) > ask (always asked, whatever risk the plugin declares) > allow.
# "Always" in the permission dialog adds a rule to `allow` here (comments and layout kept).
[permissions]
allow = []                        # e.g. ["memory__*"]
ask = []                          # e.g. a tool you don't trust to be read-only
deny = []                         # e.g. ["gmail__send"]

[trace]
enabled = true                    # save every request/response under traces/
retention_days = 7                # delete older trace folders on startup; 0 = keep forever

# Long-term memory: data/memory/USER.md and MEMORY.md go into every session's prompt
# (capped), ARCHIVE.md is searched. Plain files; edit them as you like.
# [plugins.memory]
# user_limit = 2000               # USER.md, characters (500-20000)
# memory_limit = 8000             # MEMORY.md, characters (1000-50000)
# remind_at = "09:00"            # when a todo with a date but no time is announced
# enabled = false                 # turn memory off

# Ivy's own journal: data/journal/IVY.md, what Ivy has lived with you, in its own words.
# Written by Ivy; it goes into every session's prompt (capped).
# [plugins.journal]
# limit = 3000                    # characters (1000-20000)
# enabled = false                 # no journal: Ivy doesn't carry its feelings between sessions
